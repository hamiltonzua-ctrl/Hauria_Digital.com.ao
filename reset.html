<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex, nofollow">

    <!-- Não envia o endereço (com o link de recuperação) a outros sites -->
    <meta name="referrer" content="no-referrer">

    <title>Nova palavra-passe | HAUREA DIGITAL</title>

    <!-- Marca que o JavaScript está ativo e guarda como a página foi aberta.
         Tem de correr ANTES do Supabase, que limpa o endereço depois de o ler. -->
    <script>
        document.documentElement.classList.add("js");
        window.HAUREA_RECOVERY_LINK = /type=recovery/.test(window.location.href);
        window.HAUREA_LINK_ERROR = /error_code=|error=access_denied/.test(window.location.href);
    </script>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23080808'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='%23d4af37' font-family='Georgia,serif'%3EH%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animations.css">
</head>

<body>

    <noscript>
        Para usar a HAUREA DIGITAL, ative o JavaScript no seu navegador.
    </noscript>

    <!-- Elementos das animações -->
    <div id="scrollProgress" class="scroll-progress" aria-hidden="true"></div>
    <canvas id="bgCanvas" class="bg-canvas" aria-hidden="true"></canvas>

    <section class="auth-page">

        <a href="index.html" class="logo auth-logo" aria-label="HAUREA DIGITAL">
            <span class="auth-brand-nome">HAUREA</span>
            <span class="auth-brand-linha" aria-hidden="true"></span>
            <span class="auth-brand-sub">DIGITAL</span>
        </a>

        <div class="auth-card" data-reveal="scale">

            <p class="subtitulo">RECUPERAÇÃO DE CONTA</p>

            <h1>
                Nova
                <span>palavra-passe.</span>
            </h1>

            <p class="auth-intro" id="resetIntro">
                A verificar o link de recuperação...
            </p>

            <form id="resetForm" hidden>

                <div class="campo">
                    <label for="newPassword">Nova palavra-passe</label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Pelo menos 8 caracteres"
                        autocomplete="new-password"
                        autocapitalize="off"
                        spellcheck="false"
                        minlength="8"
                        required>
                </div>

                <div class="campo">
                    <label for="confirmPassword">Repetir a palavra-passe</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Escreva a mesma palavra-passe"
                        autocomplete="new-password"
                        autocapitalize="off"
                        spellcheck="false"
                        minlength="8"
                        required>
                </div>

                <button type="submit" id="resetSubmit" class="botao-principal auth-submit">
                    Guardar nova palavra-passe
                </button>

            </form>

            <p id="resetMessage" class="auth-message" role="alert" aria-live="polite"></p>

            <a href="index.html" id="resetBackLink" class="auth-link" hidden>
                Voltar ao início de sessão
            </a>

        </div>

        <p class="auth-footer">
            © 2026 HAUREA DIGITAL · VALOR, EXCELÊNCIA E PRESENÇA DIGITAL
        </p>

    </section>

    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Ligação à base de dados -->
    <script src="supabase-init.js"></script>

    <!-- Lógica da nova palavra-passe -->
    <script src="reset.js"></script>

    <!-- Animações (sempre por último) -->
    <script src="animations.js"></script>
</body>
</html>
